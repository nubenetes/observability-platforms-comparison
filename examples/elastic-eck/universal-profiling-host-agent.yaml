apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pf-host-agent
  namespace: elastic-system
  labels:
    app.kubernetes.io/name: pf-host-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pf-host-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pf-host-agent
    spec:
      hostPID: true
      hostNetwork: true
      tolerations:
        - operator: Exists
      containers:
      - name: host-agent
        image: registry.internal.corp/elastic/universal-profiling-agent:latest
        securityContext:
          privileged: true # Required for eBPF kernel tracing in OpenShift
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        env:
        - name: ES_HOST
          value: "https://elasticsearch-airgap.elastic-system.svc:9200"
        - name: ES_USER
          value: "elastic"
        - name: ES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: elasticsearch-airgap-es-elastic-user
              key: elastic
        volumeMounts:
        - mountPath: /sys/kernel/debug
          name: debugfs
        - mountPath: /sys/fs/bpf
          name: bpffs
        - mountPath: /lib/modules
          name: modules
          readOnly: true
      volumes:
      - name: debugfs
        hostPath:
          path: /sys/kernel/debug
      - name: bpffs
        hostPath:
          path: /sys/fs/bpf
      - name: modules
        hostPath:
          path: /lib/modules
