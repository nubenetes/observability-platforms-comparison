apiVersion: instana.io/v1
kind: InstanaAgent
metadata:
  name: instana-agent
  namespace: instana-agent
spec:
  zone:
    name: "sovereign-airgap-production"
  cluster:
    name: "ocp-prod-airgap-cluster"
  agent:
    key: "AIRGAP_PROVISIONED_AGENT_KEY"
    endpointHost: "instana-backend.internal.corp"
    endpointPort: "443"
    env:
      INSTANA_AGENT_TAGS: "env=prod,compliance=airgap,platform=openshift"
    image:
      name: "registry.internal.corp/instana/agent:latest"
      pullPolicy: "IfNotPresent"
    pod:
      tolerations:
        - operator: "Exists"
  # Enable the AutoTrace webhook for zero-touch Java/JVM bytecode mutation
  openShift:
    securityContextConstraints:
      create: true
  webhook:
    enabled: true
    image: "registry.internal.corp/instana/autotrace-webhook:latest"
